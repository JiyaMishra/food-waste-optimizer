name: Person A data and ML checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate synthetic datasets
        run: python scripts/generate_synthetic_data.py --months 6 --seed 42
      - name: Validate generated datasets
        run: python scripts/validate_data.py
      - name: Run tests
        run: pytest -q
      - name: Evaluate forecast
        run: python scripts/evaluate_model.py
