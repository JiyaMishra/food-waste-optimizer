name: Person A data and ML checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate synthetic datasets
        run: python scripts/generate_synthetic_data.py --months 6 --seed 42
      - name: Validate generated datasets
        run: python scripts/validate_data.py
      - name: Check same-seed reproducibility
        run: python scripts/check_reproducibility.py --months 6 --seed 42
      - name: Run tests
        run: pytest -q
      - name: Train final model artifact
        run: python scripts/train_model.py
      - name: Evaluate forecast against baseline
        run: python scripts/evaluate_model.py
      - name: Smoke-test dish demand prediction
        run: python scripts/predict.py --date 2026-09-01 --meal-type breakfast
      - name: Smoke-test interval attendance prediction
        run: python scripts/predict_attendance.py --date 2026-09-01 --meal-type breakfast
