name: Person C full-stack integration and tests

on:
  push:
    branches: [person-c, main]
  pull_request:
    branches: [person-c, main]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Linting (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Frontend Production Build (Typecheck + Vite)
        working-directory: frontend
        run: npm run build

      - name: Database Migrations from Zero
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check

      - name: Run Backend Pytest Suite
        run: pytest tests backend/tests -v

      - name: Run End-to-End Headless Demo Workflow
        run: python backend/scripts/demo_workflow.py
